[project]
name = "genie-gateway"
version = "0.1.0"
description = "MCP server: plain-text questions to Databricks Genie (Unity Catalog), Slack and Jira, async jobs, SSO and RBAC."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.25,<2",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42",
    "bcrypt>=4.1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["genie_gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
